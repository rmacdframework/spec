name: Canary E2E (live plugin + PyPI SDK)

# Nightly end-to-end canary: install the SDK from PyPI and the plugin from
# this repo's marketplace on a clean runner, then run real headless Claude
# Code sessions asserting governance outcomes (tests-e2e/uat.sh --marketplace).
#
# This guards the surfaces the unit suite cannot: the published wheel, the
# live marketplace install path, and drift in Claude Code itself (hook
# contract, plugin cache, headless semantics) — Claude Code updates weekly.
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN repo secret (claude setup-token;
# Pro/Max). The same secret powers the claude-bug-triage workflows. Until the
# secret is configured, the job exits early with a notice instead of failing.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upload_transcripts:
        description: >-
          Upload the UAT session transcripts as an artifact on failure.
          Off by default, and never set on the nightly schedule: the
          transcripts are full Claude Code sessions (model output, file
          contents, repo paths) and an artifact is readable by anyone with
          repo access. Turn it on deliberately when diagnosing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  canary:
    name: Live E2E canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check token
        id: guard
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret not configured — skipping canary."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.has_token == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.has_token == 'true'
        with:
          python-version: "3.12"

      - name: Install Claude Code CLI
        if: steps.guard.outputs.has_token == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run E2E UAT (marketplace mode)
        if: steps.guard.outputs.has_token == 'true'
        # --keep only when we intend to upload: it suppresses the workspace
        # cleanup so the transcripts still exist when the upload step runs.
        run: ./tests-e2e/uat.sh --marketplace ${{ inputs.upload_transcripts && '--keep' || '' }}

      - name: Upload transcripts
        if: failure() && steps.guard.outputs.has_token == 'true' && inputs.upload_transcripts
        uses: actions/upload-artifact@v4
        with:
          name: uat-transcripts-${{ github.run_id }}
          # Only the session transcripts and the bound profile. Never $UAT_WORK
          # wholesale — it contains the throwaway venv (tens of MB of wheels).
          path: |
            ${{ env.UAT_WORK }}/s*.out
            ${{ env.UAT_WORK }}/.claude/
          retention-days: 7
          if-no-files-found: warn

      - name: How to get transcripts
        if: failure() && steps.guard.outputs.has_token == 'true' && !inputs.upload_transcripts
        run: |
          echo "::notice::Transcripts were not captured (upload_transcripts is off by default)."
          echo "Re-run this workflow with them enabled:"
          echo "  gh workflow run canary-e2e.yml -R ${{ github.repository }} -f upload_transcripts=true"
          echo "Or reproduce locally:  ./tests-e2e/uat.sh --marketplace --keep"
