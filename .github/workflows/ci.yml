name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install SDK with dev dependencies
        # [dev] includes cryptography + pyyaml so the full suite (signing, YAML) runs.
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check rmacd tests

      - name: Type-check (mypy strict)
        run: mypy rmacd

      - name: Security scan (bandit)
        run: pip install bandit && bandit -r rmacd -ll

      # Note: dependency CVE audit (pip-audit on declared deps) runs in
      # publish-sdk.yml at release time, where the env is clean and scoped to
      # the project's runtime deps. Running it on PR CI would flag CVEs in the
      # runner's base image / tooling, not in what we ship.

      - name: Test (pytest + coverage gate)
        run: pytest tests/ --cov-fail-under=85
