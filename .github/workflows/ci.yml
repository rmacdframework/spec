name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency CVE sweep (Mondays 06:00 UTC). Releases can be months
    # apart, so the release-time audit alone leaves a window where a newly
    # disclosed CVE in a declared dep goes unnoticed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install SDK with dev dependencies
        # [dev] includes cryptography + pyyaml so the full suite (signing, YAML) runs.
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check rmacd tests

      - name: Type-check (mypy strict)
        run: mypy rmacd

      - name: Security scan (bandit)
        run: pip install bandit && bandit -r rmacd -ll

      # Note: dependency CVE audit (pip-audit on declared deps) runs in
      # publish-sdk.yml at release time, and in the scheduled `audit` job
      # below. It stays off PR CI deliberately: run against the live env it
      # flags CVEs in the runner's base image / tooling, not in what we ship.

      - name: Test (pytest + coverage gate)
        run: pytest tests/ --cov-fail-under=85

  audit:
    name: Dependency CVE audit
    # Schedule/manual only — deliberately not on push or pull_request, so PR
    # CI keeps its current signal. See the note in the `test` job above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: CVE audit
        # Same invocation as publish-sdk.yml: audit declared runtime deps only,
        # not the rmacd package itself, so the result is scoped to what ships.
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project > /tmp/audit-reqs.txt
          uv run --with pip-audit pip-audit -r /tmp/audit-reqs.txt --strict
