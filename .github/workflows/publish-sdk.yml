name: Publish SDK to PyPI

on:
  push:
    tags:
      - "sdk-v*"   # trigger on tags like sdk-v0.2.1, sdk-v1.0.0

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: CVE audit
        # Audit declared dependencies only, not the rmacd package itself.
        # Auditing the live environment with --strict fails on first publish,
        # since the package being released isn't on PyPI yet.
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project > /tmp/audit-reqs.txt
          uv run --with pip-audit pip-audit -r /tmp/audit-reqs.txt --strict

      - name: Static analysis
        run: uv run --with bandit bandit -r rmacd/ -ll

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: audit
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest --tb=short

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no API token needed.
        # Configure at: https://pypi.org/manage/account/publishing/
        # Publisher settings:
        #   Owner: rmacdframework
        #   Repository: spec
        #   Workflow: publish-sdk.yml
        #   Environment: pypi
