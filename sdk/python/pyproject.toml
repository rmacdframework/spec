[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rmacd-framework"
version = "0.14.1"
description = "RMACD Framework SDK - Policy evaluation for autonomous AI agents"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.10"
authors = [
    { name = "RMACD Framework Team", email = "rmacdframework@users.noreply.github.com" }
]
keywords = ["rmacd", "ai", "governance", "policy", "autonomous-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Free To Use But Restricted",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
mcp = [
    # rmacd.mcp_server targets the 1.x FastMCP API; mcp 2.0.0 removed
    # `mcp.server.fastmcp`. Remove the cap when the server is ported to 2.x.
    "mcp>=1.0,<2",
]
sign = [
    "cryptography>=41",
]
yaml = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "types-jsonschema>=4.20",
    "ruff>=0.1",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    # so the full test suite (signing) runs on a plain `.[dev]` install
    "cryptography>=41",
    # so the full test suite (MCP server) runs on a plain `.[dev]` install
    "mcp>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/rmacdframework/spec"
Documentation = "https://github.com/rmacdframework/spec/tree/main/sdk/python"
Repository = "https://github.com/rmacdframework/spec"
Issues = "https://github.com/rmacdframework/spec/issues"

[project.scripts]
rmacd = "rmacd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rmacd"]
# Bundled copies of the authoritative schemas in <repo>/schemas/
# (tests/test_schema_sync.py fails if they drift) and the built-in
# governance packs shipped as data.
artifacts = [
    "rmacd/py.typed",
    "rmacd/schemas/*.schema.json",
    "rmacd/packs/data/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional [llm] extra — imported lazily inside LLMToolClassifier; the SDK
# must type-check without it installed.
module = "anthropic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional [sign] extra — imported lazily inside rmacd.packs.signing.
module = "cryptography.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional [mcp] extra — imported lazily inside rmacd.mcp_server; the SDK
# must type-check without it installed.
module = "mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=rmacd --cov-report=term-missing"
# The suite is warning-clean as of the tz-aware timestamp fix; keep it that way.
# A naive datetime creeping back in is a correctness bug (time-window checks
# skew by the host's UTC offset), not noise, so it should fail the build.
#
# The one exemption is a warning about *upstream's* model, which we cannot act
# on: FastMCP declares `lifespan` with a generic forward reference
# (mcp/server/fastmcp/server.py), and pydantic-settings >= 2.15 warns that it
# cannot resolve it. The remedy it suggests — calling `model_rebuild()` — is for
# the package that owns the field, not its consumers. `lifespan` appears nowhere
# in rmacd. Matched by message rather than category so pytest can start without
# pydantic-settings installed (it arrives only with the optional `mcp` extra).
#
# CI resolves dependencies fresh while a developer's venv is months old, so this
# surfaced only in CI — the third failure of that shape after `mcp` 2.0.0 and the
# `tomllib`/3.10 mismatch. Committing `uv.lock` is the standing fix for the class
# (see todo.md, "Supply chain"); this entry only unblocks the symptom.
filterwarnings = [
    "error",
    "ignore:Field 'lifespan' has an incomplete definition:",
]
